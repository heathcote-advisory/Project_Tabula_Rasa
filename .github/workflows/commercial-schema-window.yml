name: Commercial schema release window
on:
  schedule:
    - cron: '0 3 * * *'
      timezone: America/New_York
permissions:
  contents: read
  actions: read
  packages: read
jobs:
  production:
    if: vars.COMMERCIAL_PRODUCTION_ENABLED == 'true' && vars.COMMERCIAL_AUTO_PRODUCTION_ENABLED == 'true'
    permissions:
      contents: read
      actions: read
      packages: read
      deployments: write
    uses: ./.github/workflows/commercial-promote.yml
    with:
      environment: production
      automatic: true
    secrets: inherit
