name: Simulated commercial schema window
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/commercial-schema-rehearsal.yml
      - tabula_rasa/deployment/schema_window.py
      - tabula_rasa/deployment/schema_migration.py
      - tests/tooling/test_schema_window*.py
permissions:
  contents: read
  actions: read
  packages: read
concurrency:
  group: simulated-commercial-schema-window
  cancel-in-progress: false
jobs:
  rehearse:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install disposable rehearsal dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m playwright install --with-deps chromium
          docker pull postgres:18.6
      - name: Exercise the simulated window and compatible recovery
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SCHEMA_WINDOW_REHEARSAL: '1'
        run: |
          python -m pytest -v --tb=short tests/tooling/test_schema_window.py tests/tooling/test_schema_window_rehearsal.py
          echo 'Simulated Render controls with pinned app containers and disposable PostgreSQL passed. No hosted promotion evidence was produced.' >> "$GITHUB_STEP_SUMMARY"
