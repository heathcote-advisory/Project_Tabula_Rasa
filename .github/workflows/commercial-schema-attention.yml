name: Commercial schema attention
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        required: true
        type: string
      schema:
        required: true
        type: string
      release:
        required: true
        type: string
      staging_result:
        type: string
    secrets:
      SCHEMA_ATTENTION_DATABASE_URL:
        required: false
      TABULA_RASA_RUNTIME_DATABASE_URL:
        required: false
jobs:
  inspect:
    permissions:
      contents: read
    uses: ./.github/workflows/commercial-schema-inspect.yml
    with:
      environment: ${{ inputs.environment }}
      schema: ${{ inputs.schema }}
    secrets:
      SCHEMA_ATTENTION_DATABASE_URL: ${{ secrets.SCHEMA_ATTENTION_DATABASE_URL }}
      TABULA_RASA_RUNTIME_DATABASE_URL: ${{ secrets.TABULA_RASA_RUNTIME_DATABASE_URL }}
  notify:
    needs: inspect
    if: needs.inspect.outputs.pending == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: commercial-schema-attention-${{ inputs.environment }}
      queue: max
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-postgres.txt
      - name: Assign the pending transition to the release operator
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CURRENT_SCHEMA: ${{ needs.inspect.outputs.current }}
          REQUIRED_SCHEMA: ${{ inputs.schema }}
          RELEASE_IMAGE: ${{ inputs.image }}
          RELEASE_COMMIT: ${{ inputs.release }}
          SCHEMA_ATTENTION_ASSIGNEE: ${{ vars.SCHEMA_ATTENTION_ASSIGNEE }}
          STAGING_RESULT: ${{ inputs.staging_result }}
          COMMERCIAL_AUTO_PRODUCTION_ENABLED: ${{ vars.COMMERCIAL_AUTO_PRODUCTION_ENABLED }}
        run: python -m tabula_rasa.deployment.schema_attention notify
