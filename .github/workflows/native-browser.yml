name: Native browser shard

on:
  workflow_call:
    inputs:
      shard:
        required: true
        type: string
      tests:
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright/python:v1.62.0-noble
      options: --init --ipc=host
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: tabula_test
          POSTGRES_DB: tabula_test
          POSTGRES_HOST_AUTH_METHOD: trust
        options: >-
          --health-cmd "pg_isready -U tabula_test -d tabula_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      HOME: /root
      TABULA_RASA_TEST_DATABASE_URL: postgresql+psycopg://tabula_test@postgres:5432/tabula_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify image Python runtime
        run: python -c 'import ssl, sys; assert sys.version_info[:2] == (3, 12); print(sys.version); print(ssl.OPENSSL_VERSION)'
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - name: Run native browser concurrency and core workflow tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python -m pytest $NATIVE_TEST_FILES -ra --durations=20 --junitxml=native-browser-results.xml
        env:
          TABULA_RASA_REQUIRE_BROWSER_TESTS: '1'
          NATIVE_TEST_FILES: ${{ inputs.tests }}
      - name: Upload native browser results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: native-browser-results-${{ inputs.shard }}
          path: |
            native-browser-results.xml
            web/test-results/
          if-no-files-found: ignore
