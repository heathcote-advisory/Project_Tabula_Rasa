name: Commercial environment promotion
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        type: string
      automatic:
        type: boolean
      rollback_from:
        required: false
        type: string
      staging_run:
        type: string
      previous_image:
        type: string
      recovery_sha256:
        type: string
jobs:
  deploy:
    if: >-
      (inputs.environment == 'development' ||
      (inputs.environment == 'staging' && (!inputs.automatic ||
       (github.event_name == 'workflow_run' &&
        github.workflow_ref == format('{0}/.github/workflows/commercial-image.yml@refs/heads/main', github.repository) &&
        vars.COMMERCIAL_DEPLOY_ENABLED == 'true' && vars.COMMERCIAL_AUTO_STAGING_ENABLED == 'true'))) ||
      (inputs.automatic && inputs.environment == 'production' && github.event_name == 'schedule' &&
       github.workflow_ref == format('{0}/.github/workflows/commercial-schema-window.yml@refs/heads/main', github.repository) &&
       vars.COMMERCIAL_PRODUCTION_ENABLED == 'true' && vars.COMMERCIAL_AUTO_PRODUCTION_ENABLED == 'true') ||
      (!inputs.automatic && inputs.environment == 'production' && github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' && github.workflow_ref ==
       format('{0}/.github/workflows/commercial-production.yml@refs/heads/main', github.repository) &&
       vars.COMMERCIAL_PRODUCTION_ENABLED == 'true'))
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ !inputs.automatic || inputs.environment != 'production' }}
    concurrency:
      group: commercial-deploy-${{ inputs.environment }}
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ${{ inputs.image }}
      STAGING_ROLLBACK_FROM: ${{ inputs.rollback_from }}
      PRODUCTION_STAGING_RUN: ${{ inputs.staging_run }}
      PRODUCTION_PREVIOUS_IMAGE: ${{ inputs.previous_image }}
      PRODUCTION_RECOVERY_SHA256: ${{ inputs.recovery_sha256 }}
      STAGING_RENDER_SERVICE_ID: ${{ vars.STAGING_RENDER_SERVICE_ID }}
      PRODUCTION_OIDC_ISSUER: ${{ vars.PRODUCTION_OIDC_ISSUER }}
      PRODUCTION_OIDC_CLIENT_ID: ${{ vars.PRODUCTION_OIDC_CLIENT_ID }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TABULA_RASA_ENVIRONMENT: ${{ inputs.environment }}
      TABULA_RASA_PUBLIC_ORIGIN: ${{ vars.TABULA_RASA_PUBLIC_ORIGIN }}
      TABULA_RASA_DEPLOY_DATABASE_SHA256: ${{ vars.TABULA_RASA_DEPLOY_DATABASE_SHA256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install smoke browser
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: Install production preflight database parser
        if: inputs.environment == 'production' || inputs.automatic
        run: python -m pip install -r requirements-postgres.txt
      - name: Promote through the verified automatic release path
        if: inputs.automatic
        id: automatic
        env:
          RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha }}
          COMMERCIAL_AUTO_PRODUCTION_ENABLED: ${{ vars.COMMERCIAL_AUTO_PRODUCTION_ENABLED }}
          PRODUCTION_RECOVERY_GENERATION: ${{ vars.PRODUCTION_RECOVERY_GENERATION }}
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STAGING_RENDER_API_KEY: ${{ inputs.environment == 'production' && secrets.STAGING_RENDER_API_KEY || '' }}
          WINDOW_EXCLUSIVE_RENDER_WRITER: ${{ vars.WINDOW_EXCLUSIVE_RENDER_WRITER }}
          WINDOW_VERIFIED_SUSPEND_SERVICE_ID: ${{ vars.WINDOW_VERIFIED_SUSPEND_SERVICE_ID }}
          WINDOW_MIGRATION_DATABASE_URL: ${{ secrets.WINDOW_MIGRATION_DATABASE_URL || secrets.TABULA_RASA_MIGRATION_DATABASE_URL }}
          NEON_PROJECT_ID: ${{ vars.NEON_PROJECT_ID }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          NEON_ENDPOINT_ID: ${{ vars.NEON_ENDPOINT_ID }}
          NEON_RELEASE_API_KEY: ${{ secrets.NEON_RELEASE_API_KEY }}
        run: python -m tabula_rasa.deployment.automatic_release
      - name: Verify tested main image and metadata
        if: '!inputs.automatic'
        env:
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STAGING_RENDER_API_KEY: ${{ inputs.environment == 'production' && secrets.STAGING_RENDER_API_KEY || '' }}
        run: |
          python -m tabula_rasa.deployment.release verify --image "$IMAGE" > preflight.json
          cat preflight.json >> "$GITHUB_STEP_SUMMARY"
      - name: Select verified production release code
        if: inputs.environment == 'production' && !inputs.automatic
        id: tested-release
        run: |
          python - <<'PY'
          import json
          import os
          import re

          with open('preflight.json', encoding='utf-8') as source:
              revision = json.load(source)['release']
          if not isinstance(revision, str) or not re.fullmatch('[0-9a-f]{40}', revision):
              raise SystemExit('The verified release commit is missing or invalid.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'revision={revision}\n')
          PY
      - name: Check out tested production release code
        if: inputs.environment == 'production' && !inputs.automatic
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tested-release.outputs.revision }}
          fetch-depth: 0
      - name: Recheck production with tested release code
        if: inputs.environment == 'production' && !inputs.automatic
        env:
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        run: |
          python -m pip install -r requirements-postgres.txt
          python -m tabula_rasa.deployment.release verify --image "$IMAGE" > preflight.json
          cat preflight.json >> "$GITHUB_STEP_SUMMARY"
      - name: Explicit bound migration (separate credential and process)
        if: '!inputs.automatic'
        env:
          TABULA_RASA_DATABASE_URL: ${{ secrets.TABULA_RASA_MIGRATION_DATABASE_URL }}
        run: |
          docker run --rm \
            -e TABULA_RASA_DATABASE_URL -e TABULA_RASA_ENVIRONMENT \
            -e TABULA_RASA_DEPLOY_DATABASE_SHA256 \
            "$IMAGE" python -m tabula_rasa.deployment.database migrate
      - name: Deploy, verify and recover prior compatible image on smoke failure
        if: '!inputs.automatic && vars.TABULA_RASA_ACCESS_MODE == ''restricted_alpha'''
        env:
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          TABULA_RASA_ALPHA_USERNAME: ${{ secrets.TABULA_RASA_ALPHA_USERNAME }}
          TABULA_RASA_ALPHA_PASSWORD: ${{ secrets.TABULA_RASA_ALPHA_PASSWORD }}
        run: |
          python -m tabula_rasa.deployment.release promote --image "$IMAGE" > release.json
          cat release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy and verify named-user boundary (operator rollback on failure)
        if: '!inputs.automatic && vars.TABULA_RASA_ACCESS_MODE == ''named_user'''
        env:
          TABULA_RASA_ACCESS_MODE: ${{ vars.TABULA_RASA_ACCESS_MODE }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          STAGING_RENDER_API_KEY: ${{ inputs.environment == 'production' && secrets.STAGING_RENDER_API_KEY || '' }}
        run: |
          python -m tabula_rasa.deployment.release promote --image "$IMAGE" > release.json
          cat release.json >> "$GITHUB_STEP_SUMMARY"
      - name: Retain automatic staging evidence
        if: inputs.environment == 'staging' && steps.automatic.outputs.promoted == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: staging-release-${{ github.event.workflow_run.head_sha }}
          path: release.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Record production failure
        if: failure() && inputs.environment == 'production'
        run: |
          echo 'Production promotion failed. Inspect the failed step, release preflight and Render before retrying.' >> "$GITHUB_STEP_SUMMARY"
          echo 'For a live but unhealthy candidate, restrict ingress and use the reviewed compatible application rollback procedure.' >> "$GITHUB_STEP_SUMMARY"
