name: Read-only production provider access diagnostic
on:
  workflow_dispatch:
    inputs:
      export_staging:
        description: Encrypt the verified staging credential for production secret repair
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  export-staging:
    if: inputs.export_staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: staging
      deployment: false
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyNaCl==1.6.1
      - name: Verify and encrypt staging access for the production environment
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import HTTPRedirectHandler, Request, build_opener
          from nacl.public import PublicKey, SealedBox

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          service, token = os.environ['RENDER_SERVICE_ID'], os.environ['RENDER_API_KEY']
          if service != 'srv-db45q43bc2fs73aniv1g' or not token:
              raise SystemExit('Unexpected staging binding or missing credential.')
          request = Request(f'https://api.render.com/v1/services/{service}/deploys?limit=1',
                            headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
          try:
              with build_opener(NoRedirect).open(request, timeout=30) as response:
                  if response.status != 200:
                      raise ValueError
          except Exception:
              raise SystemExit('Staging credential verification failed; nothing exported.') from None
          key = PublicKey(base64.b64decode('nv7xaH6Qu9qXIchgUbn4W8SjjBxNEp5NkI7ktPZKt2k='))
          encrypted = base64.b64encode(SealedBox(key).encrypt(token.encode())).decode()
          Path('encrypted_secret.json').write_text(json.dumps({
              'key_id': '3380204578043523366', 'encrypted_value': encrypted,
          }), encoding='utf-8')
          print('Staging credential verified and encrypted for the production environment.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-production-staging-access
          path: encrypted_secret.json
          if-no-files-found: error
          retention-days: 1
  inspect:
    if: '!inputs.export_staging'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
      deployment: false
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check configured Render credentials without changing provider state
        env:
          STAGING_RENDER_SERVICE_ID: ${{ vars.STAGING_RENDER_SERVICE_ID }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          python - <<'PY'
          import os
          import re
          from urllib.error import HTTPError
          from urllib.request import HTTPRedirectHandler, Request, build_opener

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          checks = [
              ('staging secret -> staging', 'STAGING_RENDER_API_KEY', 'STAGING_RENDER_SERVICE_ID'),
              ('production secret -> production', 'RENDER_API_KEY', 'RENDER_SERVICE_ID'),
              ('production secret -> staging', 'RENDER_API_KEY', 'STAGING_RENDER_SERVICE_ID'),
          ]
          for label, key, target in checks:
              service, token = os.environ.get(target, ''), os.environ.get(key, '')
              if not re.fullmatch(r'srv-[a-z0-9]+', service) or not token:
                  print(f'{label}: missing credential or invalid service binding')
                  continue
              request = Request(f'https://api.render.com/v1/services/{service}/deploys?limit=1',
                                headers={'Authorization': 'Bearer ' + token, 'Accept': 'application/json'})
              try:
                  with build_opener(NoRedirect).open(request, timeout=30) as response:
                      print(f'{label}: HTTP {response.status}')
              except HTTPError as error:
                  print(f'{label}: HTTP {error.code}')
              except Exception:
                  print(f'{label}: transport failure (details withheld)')
          PY
